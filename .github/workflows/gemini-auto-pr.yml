name: Add Daily Math Quiz Section

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific math topic or grade level (optional)'
        required: false
        default: 'General Arithmetic & Algebra'
  # Optional: Uncomment below to automatically add a new quiz every day at 6 AM UTC
  # schedule:
  #   - cron: '0 6 * * *'

jobs:
  append-math-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK & Dependencies
        run: pip install google-genai pydantic

      - name: Update index.html with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MATH_TOPIC: ${{ github.event.inputs.topic || 'General Arithmetic' }}
        run: |
          python - << 'EOF'
          import os
          from datetime import datetime
          from google import genai
          from pydantic import BaseModel, Field

          # 1. Read existing index.html
          html_path = "index.html"
          if not os.path.exists(html_path):
              raise FileNotFoundError(f"{html_path} not found in repository root.")

          with open(html_path, "r", encoding="utf-8") as f:
              existing_html = f.read()

          today_str = datetime.now().strftime("%B %d, %Y")
          math_topic = os.environ.get("MATH_TOPIC", "General Arithmetic")

          # 2. Schema for structured response
          class UpdatedFile(BaseModel):
              updated_html: str = Field(description="The complete, valid HTML document with the new subsection injected.")

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          system_instruction = (
              "You are an expert web developer specializing in semantic HTML, clean CSS, and vanilla JavaScript. "
              "Your task is to take an existing HTML document, locate the Math Quiz section, and append a new "
              "subsection containing today's date and exactly 10 interactive quiz questions with answer validation/feedback. "
              "You must preserve all existing sections, styles, scripts, and document structure intact."
          )

          prompt = f"""
          Today's Date: {today_str}
          Math Topic: {math_topic}

          Instructions:
          1. Find the Math Quiz section within the provided HTML (look for <section id="math-quiz">, a section with a heading containing 'Math Quiz', or create the main Math Quiz section if it does not exist).
          2. Under this Math Quiz section, append a new sub-section titled with today's date: "{today_str}".
          3. Inside this sub-section, generate 10 unique, multiple-choice or input-based math questions related to '{math_topic}'.
          4. Include lightweight vanilla JavaScript/CSS logic so the user can answer and receive immediate score/feedback.
          5. Return the entire, unbroken HTML document.

          Existing HTML Content:
          ```html
          {existing_html}
          ```
          """

          response = client.models.generate_content(
              model="gemini-2.5-flash",
              contents=prompt,
              config={
                  "system_instruction": system_instruction,
                  "response_mime_type": "application/json",
                  "response_schema": UpdatedFile,
              }
          )

          result = UpdatedFile.model_validate_json(response.text)

          # 3. Overwrite index.html with the updated code
          with open(html_path, "w", encoding="utf-8") as f:
              f.write(result.updated_html)

          print(f"Successfully updated {html_path} with 10 questions for {today_str}.")
          EOF

      - name: Get Current Date for PR Title
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(quiz): add math quiz subsection for ${{ steps.date.outputs.TODAY }}"
          branch: "gemini/math-quiz-${{ steps.date.outputs.TODAY }}"
          title: "🤖 Gemini: Add Math Quiz (${{ steps.date.outputs.TODAY }})"
          body: |
            Automated daily math quiz addition generated by Gemini.
            - **Date Added:** ${{ steps.date.outputs.TODAY }}
            - **Questions:** 10
            - **Target Section:** Math Quiz
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
