name: Generate Math Quiz via Gemini

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Quiz specification prompt for Gemini'
        required: true
        default: 'Create an interactive single-page Math Quiz app with score tracking and a clean UI.'

jobs:
  build-math-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK & Dependencies
        run: pip install google-genai pydantic

      - name: Generate Quiz Files with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python - << 'EOF'
          import os
          from google import genai
          from pydantic import BaseModel, Field

          # Structured output schema to guarantee clean file creation
          class FileSpec(BaseModel):
              path: str = Field(description="Relative file path, e.g., index.html or js/app.js")
              content: str = Field(description="Complete raw source code for the file")

          class ProjectOutput(BaseModel):
              files: list[FileSpec]

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          
          system_instruction = (
              "You are an expert web developer. Generate the complete source code files for the requested project. "
              "Provide valid HTML, modern CSS, and JavaScript. Do not include markdown codeblocks inside the file contents."
          )

          prompt = f"User Request: {os.environ['USER_PROMPT']}"

          response = client.models.generate_content(
              model="gemini-2.5-flash",
              contents=prompt,
              config={
                  "system_instruction": system_instruction,
                  "response_mime_type": "application/json",
                  "response_schema": ProjectOutput,
              }
          )

          project_data = ProjectOutput.model_validate_json(response.text)

          for file in project_data.files:
              os.makedirs(os.path.dirname(file.path) if os.path.dirname(file.path) else '.', exist_ok=True)
              with open(file.path, 'w', encoding='utf-8') as f:
                  f.write(file.content)
              print(f"Generated: {file.path}")
          EOF

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add interactive math quiz via Gemini"
          branch: "gemini/math-quiz"
          title: "🤖 Gemini: Add Math Quiz Application"
          body: |
            Automated feature addition generated by Gemini.
            
            **Prompt:** `${{ github.event.inputs.prompt }}`
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
